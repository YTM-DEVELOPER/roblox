const extraBangSeed=`나트륨 리튬 칼륨 세슘 루비듐 바륨 라듐 헬륨 네온 아르곤 크립톤 제논 라돈 우라늄 플루오린 염소 브로민 아이오딘 텔루륨 셀레늄 티타늄 지르코늄 하프늄 탄탈럼 몰리브데넘 텅스텐 레늄 오스뮴 이리듐 로듐 팔라듐 루테늄 코발트 니켈 크로뮴 망가니즈 카드뮴 인듐 갈륨 탈륨 비스무트 안티모니 프라세오디뮴 네오디뮴 프로메튬 유로퓸 가돌리늄 테르븀 디스프로슘 홀뮴 에르븀 툴륨 이터븀 루테튬 악티늄 토륨 넵투늄 플루토늄 아메리슘 퀴륨 버클륨 캘리포늄 아인슈타이늄 페르뮴 멘델레븀 노벨륨 로렌슘`;
const STORE='wordfinder_custom_v1';let words=[];const $=id=>document.getElementById(id);const clean=s=>s.trim().replace(/\s+/g,'');
 const HIDDEN='wordfinder_hidden_v1',selected=new Set();
 function readCustom(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}
 function load(){let custom=readCustom();custom=custom.map(x=>x&&x.word?{...x,bang:x.word.endsWith('녘')?true:!!x.bang}:x);save(custom);let hidden=[];try{hidden=JSON.parse(localStorage.getItem(HIDDEN)||'[]')}catch{};const map=new Map();for(const w of (seed+' '+extraSeed).split(/\s+/))if(w.length>=2)map.set(w,{word:w,bang:w.endsWith('녘')});for(const w of (bangSeed+' '+extraBangSeed).split(/\s+/))if(w.length>=2)map.set(w,{word:w,bang:true});for(const w of ['수은'])if(map.has(w))map.set(w,{word:w,bang:false});for(const item of custom){if(item&&item.word&&item.word.length>=2)map.set(item.word,{word:item.word,bang:item.word.endsWith('녘')?true:!!item.bang})}for(const w of hidden)map.delete(w);words=[...map.values()].sort((a,b)=>a.word.localeCompare(b.word,'ko'));$('total').textContent=words.length;render()}
 function filtered(){const q=clean($('query').value),start=clean($('starts').value),end=clean($('ends').value),bang=$('onlyBang').checked,category=$('categoryFilter').value;return words.filter(x=>(!q||x.word.includes(q))&&(!start||x.word.startsWith(start))&&(!end||x.word.endsWith(end))&&(!bang||x.bang)&&(category==='all'||(category==='bang'?x.bang:!x.bang))).sort((a,b)=>Number(b.bang)-Number(a.bang)||a.word.localeCompare(b.word,'ko'))}
 function render(){const list=filtered();$('count').innerHTML=`<strong>${list.length.toLocaleString()}개</strong> 단어`;const parts=[];if($('starts').value)parts.push(`첫 글자: ${$('starts').value}`);if($('ends').value)parts.push(`끝 글자: ${$('ends').value}`);if($('onlyBang').checked)parts.push('한방 단어');$('scope').textContent=parts.join(' · ');const host=$('results');host.replaceChildren();if(!list.length){host.innerHTML='<div class="empty">조건에 맞는 단어가 없어요.<br>다른 글자로 검색하거나 단어 파일을 가져와 보세요.</div>';return}for(const item of list.slice(0,300)){const row=document.createElement('div');row.className='word';const actions=document.createElement('span');actions.className='row-actions';const copy=document.createElement('button');copy.className='copy-btn';copy.textContent='복사';copy.onclick=async()=>{try{await navigator.clipboard.writeText(item.word)}catch{const area=document.createElement('textarea');area.value=item.word;document.body.append(area);area.select();document.execCommand('copy');area.remove()}toast(`'${item.word}' 복사했어요`)};const pick=document.createElement('input');pick.type='checkbox';pick.className='pick';pick.checked=selected.has(item.word);pick.setAttribute('aria-label',`${item.word} 선택`);pick.onchange=()=>{pick.checked?selected.add(item.word):selected.delete(item.word)};actions.append(copy,pick);const name=document.createElement('span');name.className='word-name';name.textContent=item.word;const meta=document.createElement('span');meta.className='word-meta';if(item.bang){const badge=document.createElement('span');badge.className='badge';badge.textContent='한방';meta.append(badge)}const tail=document.createElement('span');tail.innerHTML=`끝 글자 <b class="tail">${item.word.slice(-1)}</b>`;meta.append(tail);row.append(actions,name,meta);host.append(row)}if(list.length>300){const more=document.createElement('div');more.className='empty';more.textContent=`결과가 ${list.length}개예요. 더 구체적으로 검색하면 원하는 단어를 찾기 쉬워요.`;host.append(more)}}
function save(items){localStorage.setItem(STORE,JSON.stringify(items))}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('query').addEventListener('input',render);$('starts').addEventListener('input',render);$('ends').addEventListener('input',render);$('onlyBang').addEventListener('change',render);$('clear').onclick=()=>{ $('query').value='';$('starts').value='';$('ends').value='';$('onlyBang').checked=false;render();$('query').focus()};$('query').addEventListener('keydown',e=>{if(e.key==='Enter')render()});
 $('addWord').onclick=()=>{const word=clean($('newWord').value);if(!word){$('newWord').focus();return}if(word.length<2){toast('두 글자 이상인 단어만 등록할 수 있어요');return}let custom=[];try{custom=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{};const idx=custom.findIndex(x=>x.word===word);const entry={word,bang:$('newBang').checked};if(idx>=0)custom[idx]=entry;else custom.push(entry);save(custom);$('newWord').value='';$('newBang').checked=false;load();toast('단어를 단어장에 추가했어요')};$('newWord').addEventListener('keydown',e=>{if(e.key==='Enter')$('addWord').click()});
 $('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();let custom=[];try{custom=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{};let count=0;for(let line of text.split(/\r?\n/)){line=line.trim();if(!line)continue;const bang=/[,\t|]\s*(한방|1|true)$/i.test(line);const word=clean(line.replace(/[,\t|]\s*(한방|1|true)$/i,''));if(word&&word.length>=2){custom.push({word,bang});count++}}save([...new Map(custom.map(x=>[x.word,x])).values()]);load();toast(`${count}개 단어를 가져왔어요`);e.target.value=''};
 function deleteWords(targetWords){const deleting=new Set(targetWords);let custom=readCustom().filter(x=>!deleting.has(x.word));save(custom);let hidden=[];try{hidden=JSON.parse(localStorage.getItem(HIDDEN)||'[]')}catch{};localStorage.setItem(HIDDEN,JSON.stringify([...new Set([...hidden,...deleting])]));for(const w of deleting)selected.delete(w);load()}
 $('categoryFilter').addEventListener('change',render);$('selectVisible').onclick=()=>{for(const item of filtered().slice(0,300))selected.add(item.word);render();toast('현재 결과를 선택했어요')};$('deleteSelected').onclick=()=>{if(!selected.size){toast('먼저 삭제할 단어를 선택해 주세요');return}const count=selected.size;deleteWords([...selected]);toast(`${count}개 단어를 삭제했어요`)};
 $('export').onclick=()=>{let custom=[];try{custom=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{};const blob=new Blob([custom.map(x=>`${x.word}${x.bang?'\t한방':''}`).join('\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='내-끝말잇기-단어장.txt';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{localStorage.removeItem(STORE);localStorage.removeItem(HIDDEN);load();toast('추가한 단어를 초기화했어요')};load();
</script></body></html>
